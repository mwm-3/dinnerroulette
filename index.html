<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dinner Roulette</title>
  <style>
    :root{
      --bg:#0f172a; --panel:#111827; --text:#e5e7eb; --muted:#9ca3af; --accent:#22d3ee; --good:#34d399; --warn:#fb7185; --shadow: 0 10px 30px rgba(0,0,0,.35);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial; background: radial-gradient(1200px 800px at 70% -10%, #1f2937 0%, var(--bg) 60%); color:var(--text)}
    .wrap{max-width:1200px;margin:0 auto;padding:24px}
    header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
    .logo{width:40px;height:40px;border-radius:12px;background:conic-gradient(from 0deg,#22d3ee,#34d399,#a78bfa,#f472b6,#fb923c,#22d3ee);filter:saturate(1.3)}
    h1{font-size:clamp(22px,3vw,34px);margin:0}
    .sub{color:var(--muted)}
    .grid{display:grid;grid-template-columns: 1.1fr .9fr; gap:22px; margin-top:22px}
    @media (max-width: 980px){.grid{grid-template-columns:1fr}}
    .card{background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01)); border:1px solid rgba(255,255,255,.06); border-radius:18px; box-shadow:var(--shadow); padding:18px}
    .wheel-area{display:grid; grid-template-rows:auto 1fr auto; gap:14px; align-items:center}
    .canvas-wrap{position:relative; display:grid; place-items:center; padding:8px}
    canvas{width:100%; height:auto; max-width:720px; aspect-ratio:1/1; filter: drop-shadow(0 12px 25px rgba(0,0,0,.4))}

    /* New pointer that clearly points into the wheel */
    .pointer{position:absolute; top:0; left:50%; transform:translate(-50%, -50%); width:0; height:0; z-index:2; 
      border-left: clamp(10px, 3.2vw, 18px) solid transparent; 
      border-right: clamp(10px, 3.2vw, 18px) solid transparent;
      border-top: clamp(18px, 4.8vw, 28px) solid var(--accent); /* triangle points DOWN into wheel */
      filter: drop-shadow(0 6px 12px rgba(0,0,0,.45));}
    .pointer::after{ /* little base to make it look like an indicator */
      content:""; position:absolute; left:50%; transform:translateX(-50%); top:-4px; width: clamp(8px, 2vw, 12px); height: clamp(6px, 1.6vw, 10px); 
      background:#0b1223; border-radius:2px; box-shadow:0 0 0 1px rgba(255,255,255,.15);
    }

    .hub{position:absolute; width:120px; height:120px; border-radius:50%; background:radial-gradient(circle at 35% 35%, #1f2937 0 50%, #0b1223 52% 100%); display:grid;place-items:center; border:1px solid rgba(255,255,255,.08)}
    @media (max-width: 640px){ .hub{ width:88px; height:88px; } }

    .btn{appearance:none; border:none; border-radius:14px; padding:12px 16px; font-weight:700; letter-spacing:.3px; cursor:pointer; color:#0b1223; background:linear-gradient(180deg,#22d3ee,#0891b2); box-shadow: 0 6px 16px rgba(8,145,178,.45); transition: transform .12s ease, filter .12s ease}
    .btn:hover{transform:translateY(-1px); filter:brightness(1.05)}
    .btn:active{transform:translateY(1px)}
    .btn.secondary{background:linear-gradient(180deg,#e5e7eb,#cbd5e1); color:#0b1223; box-shadow: 0 6px 16px rgba(148,163,184,.35)}

    .controls h2{margin:6px 0 12px;font-size:18px}
    .rows{display:grid; gap:8px; margin-top:8px}
    .row{display:grid; grid-template-columns: 1fr 140px 44px; gap:8px}
    .row input{width:100%; padding:10px 12px; border-radius:12px; border:1px solid rgba(255,255,255,.08); background:#0b1223; color:var(--text)}
    .row .del{background:linear-gradient(180deg,#fecaca,#fda4af); color:#111827}
    .totals{display:flex; justify-content:space-between; align-items:center; margin-top:10px; color:var(--muted)}
    .totals .ok{color:var(--good)}
    .totals .bad{color:var(--warn)}
    .actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px}
    .pill{display:inline-flex; gap:6px; align-items:center; padding:8px 12px; border-radius:999px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.08); color:var(--muted)}
    .winner{margin-top:14px; font-size:20px; font-weight:700}
    footer{margin-top:24px; color:var(--muted); font-size:13px}

    /* Legend */
    .legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
    .chip{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);font-size:13px}
    .dot{width:14px;height:14px;border-radius:4px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}

    /* Winner overlay: higher contrast */
    .burst{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;background:rgba(0,0,0,.55);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);}
    .burst .title-card{display:inline-flex;align-items:center;gap:12px; padding:14px 20px; border-radius:16px; background:#0b1223; color:#fff; 
      border:1px solid rgba(255,255,255,.2); box-shadow:0 12px 40px rgba(0,0,0,.55); font-weight:900; font-size:clamp(22px,6vw,56px); letter-spacing:.3px}
    .burst .swatch{width:18px;height:18px;border-radius:5px;box-shadow:inset 0 0 0 2px rgba(0,0,0,.35)}

    a{color:var(--accent); text-decoration:none}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo" aria-hidden="true"></div>
      <div>
        <h1>Dinner Roulette</h1>
        <div class="sub">Spin the weighted wheel. Whoever the pointer hits… buys dinner. 🧾🍝</div>
      </div>
    </header>

    <div class="grid">
      <section class="card wheel-area">
        <div class="pill" id="hint">Tip: percentages must total 100%. Slices are color-only; see legend for mapping.</div>
        <div class="canvas-wrap" id="canvasWrap">
          <div class="pointer" aria-hidden="true"></div>
          <canvas id="wheel" width="680" height="680" aria-label="Dinner Roulette Wheel"></canvas>
          <div class="hub">
            <button id="spinBtn" class="btn" title="Spin the wheel">SPIN</button>
          </div>
        </div>
        <div class="winner" id="winner"></div>
        <div class="legend" id="legend"></div>
      </section>

      <aside class="card controls">
        <h2>Participants & Chances</h2>
        <div class="rows" id="rows"></div>
        <div class="totals">
          <div>Total: <span id="total">0</span>%</div>
          <div id="status"></div>
        </div>
        <div class="actions">
          <button class="btn secondary" id="addRow">+ Add Row</button>
          <button class="btn secondary" id="example">Load Parents 90% / Kids 10%</button>
          <button class="btn secondary" id="shuffleColors">Shuffle Colors</button>
          <button class="btn" id="apply">Apply to Wheel</button>
        </div>
      </aside>
    </div>

    <footer>Built for fun. Math is fair; teasing is optional. 💸</footer>
  </div>

<script>
(function(){
  const wheel = document.getElementById('wheel');
  const ctx = wheel.getContext('2d');
  const spinBtn = document.getElementById('spinBtn');
  const rowsEl = document.getElementById('rows');
  const totalEl = document.getElementById('total');
  const statusEl = document.getElementById('status');
  const winnerEl = document.getElementById('winner');
  const addRowBtn = document.getElementById('addRow');
  const exampleBtn = document.getElementById('example');
  const applyBtn = document.getElementById('apply');
  const shuffleBtn = document.getElementById('shuffleColors');
  const canvasWrap = document.getElementById('canvasWrap');

  let entries = [ {name:'Parents', pct: 90}, {name:'Kids', pct: 10} ];
  let palette = genPalette();
  let slices = [];
  let angle = -Math.PI/2;
  let spinning = false;
  let spinStart = 0, angularVel = 0;

  function genPalette(){
    return ["#ff0000","#00a2ff","#00d100","#ffd600","#ff00ff","#00ffff","#ff6b00","#8b00ff","#00ff87","#ff2e55"];
  }
  function getColorForIdx(idx){
    const name = (entries[idx]?.name||'').trim().toLowerCase();
    if(name==='parents') return '#ff0000';
    if(name==='kids') return '#00a2ff';
    return palette[idx % palette.length];
  }
  function shuffle(arr){ for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]} return arr; }
  function round2(n){return Math.round(n*100)/100}

  // Responsive canvas sizing for mobile
  function resizeCanvas(){
    const rect = canvasWrap.getBoundingClientRect();
    const size = Math.min(rect.width, 720); // cap at 720 for desktops
    wheel.style.width = size + 'px';
    wheel.style.height = size + 'px';
    wheel.width = size; // simple sizing (non-retina) for stability
    wheel.height = size;
    drawWheel();
  }
  window.addEventListener('resize', resizeCanvas);

  function updateTotals(){
    const sum = entries.reduce((a,e)=>a+(parseFloat(e.pct)||0),0);
    totalEl.textContent = round2(sum);
    statusEl.textContent = sum===100? 'All set ✅' : (sum>100? 'Over 100% ❌' : 'Under 100% ⚠️');
    statusEl.className = sum===100? 'ok' : (sum>100? 'bad' : '');
    return sum;
  }

  function mkRow(idx, e){
    const row = document.createElement('div'); row.className='row';
    row.innerHTML = `
      <input type="text" placeholder="Name (e.g., Parents)" value="${e.name||''}" aria-label="Name" />
      <input type="number" step="0.1" min="0" max="100" placeholder="%" value="${e.pct||0}" aria-label="Percentage" />
      <button class="btn del" title="Delete">✕</button>`;
    const [nameEl, pctEl, delEl] = row.children;
    nameEl.addEventListener('input', ()=>{ entries[idx].name = nameEl.value; renderLegend(); });
    pctEl.addEventListener('input', ()=>{ entries[idx].pct = parseFloat(pctEl.value)||0; updateTotals(); });
    delEl.addEventListener('click', ()=>{ entries.splice(idx,1); renderRows(); build(); });
    return row;
  }
  function renderRows(){ rowsEl.innerHTML=''; entries.forEach((e,i)=> rowsEl.appendChild(mkRow(i,e))); updateTotals(); }

  function distributeSlices(){
    const total = 100; const TAU = Math.PI*2;
    const counts = entries.map(e=>Math.max(0, Math.round((parseFloat(e.pct)||0))));
    let sum = counts.reduce((a,b)=>a+b,0); if(sum===0) return [];
    let diff = total - sum; if(diff!==0){ const li = counts.indexOf(Math.max(...counts)); counts[li] = Math.max(0, counts[li] + diff); }
    const needBumps = counts.map(c=> (c===1?1:0)); let bumps = needBumps.reduce((a,b)=>a+b,0);
    while(bumps>0){ const li = counts.indexOf(Math.max(...counts)); const si = needBumps.findIndex(v=>v===1); if(si===-1||counts[li]<=2) break; counts[li]--; counts[si]++; needBumps[si]=0; bumps--; }

    const pool = new Array(total).fill(-1); const remaining = counts.slice();
    const kidsIdx = entries.findIndex(e=> (e.name||'').trim().toLowerCase()==='kids');
    if(kidsIdx>=0 && remaining[kidsIdx]>=2){ const k=remaining[kidsIdx]; const gap = total/k; for(let i=0;i<k;i++){ let pos=Math.round(i*gap)%total; let tries=0; while(pool[pos]!==-1 && tries<total){pos=(pos+1)%total;tries++;} if(pool[pos]===-1){ pool[pos]=kidsIdx; remaining[kidsIdx]--; } } }
    for(let p=0;p<total;p++){ if(pool[p]!==-1) continue; const prev=pool[(p-1+total)%total]; let best=-1, bestCount=-1; for(let i=0;i<remaining.length;i++){ if(remaining[i]>bestCount && i!==prev && remaining[i]>0){ best=i; bestCount=remaining[i]; } } if(best===-1){ best=remaining.findIndex(c=>c>0); } if(best===-1) break; pool[p]=best; remaining[best]--; }
    if(pool.length>1 && pool[0]===pool[pool.length-1]){ const j = pool.findIndex((v,idx)=> v!==pool[0] && pool[(idx-1+pool.length)%pool.length]!==pool[0]); if(j>0){ const rot = pool.slice(j).concat(pool.slice(0,j)); for(let i=0;i<pool.length;i++) pool[i]=rot[i]; } }

    const result=[]; let current=null; for(let i=0;i<pool.length;i++){ const idx=pool[i]; if(idx<0||!entries[idx]||entries[idx].pct<=0) continue; if(!current||current.idx!==idx){ if(current) result.push(current); current={idx,len:1}; } else { current.len++; } } if(current) result.push(current);
    let acc=0; return result.map(r=>{ const frac=r.len/total; const start=acc; const end=acc+frac*TAU; acc=end; const color=getColorForIdx(r.idx); return { name: entries[r.idx].name||`#${r.idx+1}`, color, start, end, idx:r.idx}; });
  }

  function drawWheel(){
    const W=wheel.width,H=wheel.height,cx=W/2,cy=H/2,r=Math.min(W,H)/2-16;
    ctx.clearRect(0,0,W,H); ctx.save(); ctx.translate(cx,cy); ctx.rotate(angle);
    ctx.beginPath(); ctx.arc(0,0,r+10,0,Math.PI*2); ctx.fillStyle='#0b1223'; ctx.fill();
    slices.forEach(seg=>{ ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,r,seg.start,seg.end); ctx.closePath(); ctx.fillStyle=seg.color; ctx.fill(); });
    ctx.beginPath(); ctx.arc(0,0,Math.max(70, W*0.08),0,Math.PI*2); ctx.strokeStyle='rgba(255,255,255,.12)'; ctx.lineWidth=Math.max(10, W*0.02); ctx.stroke();
    ctx.restore();
  }

  function build(){ slices = distributeSlices(); drawWheel(); renderLegend(); }

  function getSliceAtPointer(){
    const TAU=Math.PI*2; const pointerAngle=((-Math.PI/2)-angle)%TAU; const norm=(pointerAngle+TAU)%TAU;
    for(const seg of slices){ const s=(seg.start+TAU)%TAU,e=(seg.end+TAU)%TAU; if(s<e){ if(norm>=s&&norm<e) return seg; } else { if(norm>=s||norm<e) return seg; } }
    return null;
  }

  function spin(){
    if(spinning||slices.length===0) return; winnerEl.textContent=''; spinning=true;
    angularVel = 12 + Math.random()*6; const frictionHigh=9 + Math.random()*3; spinStart=performance.now();
    const step=(t)=>{ const dt=(t-spinStart)/1000; spinStart=t; angle += angularVel*dt; if(angularVel>2.5){ angularVel -= frictionHigh*dt; } else if(angularVel>0.5){ angularVel *= Math.pow(0.80, dt); } else if(angularVel>0.18){ angularVel *= Math.pow(0.70, dt); } else { angularVel=0; }
      drawWheel(); if(angularVel>0){ requestAnimationFrame(step); } else { spinning=false; conclude(); } };
    requestAnimationFrame(step);
  }

  function confettiBurst(){
    const n=60, emojis=['💵','🍕','🍝','🍣','🍔','🌮','🥗'];
    for(let i=0;i<n;i++){ const s=document.createElement('div'); s.textContent=emojis[Math.floor(Math.random()*emojis.length)]; s.style.position='fixed'; s.style.left=(Math.random()*100)+'vw'; s.style.top='-40px'; s.style.fontSize=(16+Math.random()*24)+'px'; s.style.transition='transform 1.6s cubic-bezier(.2,.6,.2,1), opacity 1.6s ease'; s.style.zIndex=9998; document.body.appendChild(s); setTimeout(()=>{ s.style.transform=`translateY(${110+Math.random()*70}vh) rotate(${(Math.random()*720-360)}deg)`; s.style.opacity='0'; },10); setTimeout(()=>s.remove(),1800); }
  }

  function celebrateWinner(name,color){
    const layer=document.createElement('div'); layer.className='burst';
    const card=document.createElement('div'); card.className='title-card';
    const sw=document.createElement('span'); sw.className='swatch'; sw.style.background=color; card.appendChild(sw);
    const text=document.createElement('span'); text.textContent=`${name} pays for dinner! 🎉`; card.appendChild(text);
    layer.appendChild(card); document.body.appendChild(layer);
    // colored particles
    const dotCount=84; for(let i=0;i<dotCount;i++){ const d=document.createElement('div'); d.style.position='fixed'; d.style.width='10px'; d.style.height='10px'; d.style.borderRadius='50%'; d.style.left='50%'; d.style.top='50%'; d.style.transform='translate(-50%,-50%)'; d.style.background=color; d.style.boxShadow='0 0 0 1px rgba(0,0,0,.25)'; d.style.opacity='1'; d.style.transition='transform 900ms cubic-bezier(.16,1,.3,1), opacity 1200ms ease'; d.style.zIndex=9999; document.body.appendChild(d); const a=Math.random()*Math.PI*2, dist=80+Math.random()*280; setTimeout(()=>{ d.style.transform=`translate(calc(-50% + ${Math.cos(a)*dist}px), calc(-50% + ${Math.sin(a)*dist}px))`; d.style.opacity='0'; },10); setTimeout(()=>d.remove(),1300); }
    setTimeout(()=>layer.remove(),1500);
  }

  function conclude(){
    const seg=getSliceAtPointer();
    if(seg){ const name=entries[seg.idx]?.name || seg.name || 'Winner'; winnerEl.textContent=`${name} pays for dinner! 🎉`; celebrateWinner(name, seg.color); confettiBurst(); }
    else { winnerEl.textContent="Couldn't determine a winner. Try again."; }
  }

  function addRow(name='', pct=0){ entries.push({name, pct}); renderRows(); }

  addRowBtn.addEventListener('click', ()=> addRow('', 0));
  exampleBtn.addEventListener('click', ()=>{ entries = [ {name:'Parents', pct:90}, {name:'Kids', pct:10} ]; renderRows(); build(); });
  applyBtn.addEventListener('click', ()=>{ const sum=updateTotals(); if(sum!==100){ alert('Total must equal 100%.'); return; } build(); });
  shuffleBtn.addEventListener('click', ()=>{ palette = shuffle(genPalette()); build(); });
  spinBtn.addEventListener('click', spin);

  function renderLegend(){
    const legend=document.getElementById('legend'); legend.innerHTML='';
    entries.forEach((e,i)=>{ if(!e||(parseFloat(e.pct)||0)<=0) return; const chip=document.createElement('div'); chip.className='chip'; const dot=document.createElement('span'); dot.className='dot'; dot.style.background=getColorForIdx(i); chip.appendChild(dot); const label=document.createElement('span'); label.textContent=`${e.name||('#'+(i+1))} — ${round2(parseFloat(e.pct)||0)}%`; chip.appendChild(label); legend.appendChild(chip); });
  }

  // Initial UI
  renderRows();
  build();
  resizeCanvas();
})();
</script>
</body>
</html>
